<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masterpiece Builder | SigHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #34d399;
        }

        .neo-border {
            border: 4px solid #000;
        }

        .neo-shadow {
            box-shadow: 8px 8px 0px 0px #000;
        }

        .neo-shadow-sm {
            box-shadow: 4px 4px 0px 0px #000;
        }

        .btn-press:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px #000;
        }

        input {
            background-color: white;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            background-color: #fef08a;
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px 0px #000;
        }

        /* Mix & Match State Classes */
        .sig-container.no-border {
            border: none !important;
            box-shadow: none !important;
        }

        .sig-container.centered {
            text-align: center;
        }

        .sig-container.centered #accent-bar {
            margin-left: auto;
            margin-right: auto;
        }

        .sig-container.centered .social-row {
            justify-content: center;
        }

        .sig-container.dark-mode {
            background-color: #000 !important;
            color: #fff !important;
        }

        .sig-container.dark-mode p {
            color: #a1a1aa !important;
        }

        .sig-container.side-pillar {
            border-left: 12px solid #000 !important;
        }

        .sig-container.side-pillar #accent-bar {
            display: none;
        }

        .sig-container.airy {
            padding: 3rem !important;
        }

        .avatar-box.rounded {
            border-radius: 9999px;
        }

        .toggle-active {
            background-color: #000 !important;
            color: #fff !important;
        }
    </style>
</head>

<body class="p-4 md:p-8">

    <header class="max-w-7xl mx-auto flex justify-between items-center mb-8">
        <a href="index.html"
            class="neo-border bg-white px-4 py-2 neo-shadow-sm font-black text-xl uppercase tracking-tighter">SIGHUB</a>
        <div class="bg-black text-white px-4 py-1 font-bold text-xs uppercase italic">Design Laboratory v2.0</div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12">

        <!-- FORM SECTION -->
        <section class="space-y-8">
            <!-- 1. DETAILS -->
            <div class="bg-white neo-border p-6 neo-shadow">
                <h2 class="text-2xl font-black uppercase mb-4 underline">1. The Details</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="name" placeholder="Full Name" class="neo-border p-3 font-bold"
                        oninput="updatePreview()">
                    <input type="text" id="title" placeholder="Job Title" class="neo-border p-3 font-bold"
                        oninput="updatePreview()">
                    <input type="text" id="company" placeholder="Company" class="neo-border p-3 font-bold"
                        oninput="updatePreview()">
                    <input type="email" id="email" placeholder="Email" class="neo-border p-3 font-bold"
                        oninput="updatePreview()">
                </div>
            </div>

            <!-- 2. MIX & MATCH (The 8 Abilities) -->
            <div class="bg-white neo-border p-6 neo-shadow">
                <h2 class="text-2xl font-black uppercase mb-4 underline">2. Mix & Match Settings</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <button onclick="toggleAbility(this, 'no-border')"
                        class="neo-border p-2 font-black text-[10px] uppercase bg-gray-100 btn-press">No Border</button>
                    <button onclick="toggleAbility(this, 'centered')"
                        class="neo-border p-2 font-black text-[10px] uppercase bg-gray-100 btn-press">Center
                        Align</button>
                    <button onclick="toggleAbility(this, 'dark-mode')"
                        class="neo-border p-2 font-black text-[10px] uppercase bg-gray-100 btn-press">Dark Mode</button>
                    <button onclick="toggleAbility(this, 'side-pillar')"
                        class="neo-border p-2 font-black text-[10px] uppercase bg-gray-100 btn-press">Side
                        Pillar</button>
                    <button onclick="toggleAbility(this, 'airy')"
                        class="neo-border p-2 font-black text-[10px] uppercase bg-gray-100 btn-press">Extra
                        Spacing</button>
                    <button onclick="toggleAbility(this, 'avatar-round')"
                        class="neo-border p-2 font-black text-[10px] uppercase bg-gray-100 btn-press">Circle
                        Photo</button>
                    <button onclick="toggleAbility(this, 'hide-accent')"
                        class="neo-border p-2 font-black text-[10px] uppercase bg-gray-100 btn-press">Hide
                        Accent</button>
                    <button onclick="toggleAbility(this, 'compact-social')"
                        class="neo-border p-2 font-black text-[10px] uppercase bg-gray-100 btn-press">Compact
                        Icons</button>
                </div>
            </div>

            <button type="button" onclick="alert('Sending to Postgres via Railway...')"
                class="w-full bg-yellow-300 neo-border p-6 text-2xl font-black uppercase tracking-tight neo-shadow btn-press hover:bg-yellow-400">
                Generate Masterpiece ($1.99)
            </button>
        </section>

        <!-- PREVIEW SECTION -->
        <section class="lg:sticky lg:top-8 self-start">
            <div class="bg-white neo-border p-8 neo-shadow transition-all duration-300 sig-container overflow-hidden"
                id="main-sig">
                <div class="flex flex-col md:flex-row gap-8 items-start">
                    <!-- Photo Box -->
                    <div id="avatar"
                        class="avatar-box w-24 h-24 bg-pink-400 neo-border neo-shadow-sm flex-shrink-0 flex items-center justify-center text-4xl">
                        👤
                    </div>

                    <!-- Text Content -->
                    <div class="flex-grow">
                        <div id="accent-bar" class="w-12 h-2 bg-yellow-300 mb-4 neo-border"></div>
                        <h2 id="prev-name" class="text-3xl font-black uppercase leading-none">Your Name</h2>
                        <p id="prev-meta" class="text-lg font-bold text-gray-500 mt-1 mb-4 italic">Title @ Company</p>

                        <div class="space-y-1 font-bold text-sm">
                            <p id="prev-email">hello@example.com</p>
                        </div>

                        <div class="social-row mt-6 flex gap-2">
                            <div
                                class="social-icon w-8 h-8 neo-border bg-black text-white flex items-center justify-center text-[10px]">
                                IN</div>
                            <div
                                class="social-icon w-8 h-8 neo-border bg-black text-white flex items-center justify-center text-[10px]">
                                TW</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-6 bg-white neo-border p-4 font-bold italic text-xs">
                * Note: Your final download includes HTML, PNG, and a Direct-to-Gmail copy link.
            </div>
        </section>
    </main>

    <script>
        function updatePreview() {
            document.getElementById('prev-name').innerText = document.getElementById('name').value || 'Your Name';
            document.getElementById('prev-meta').innerText = (document.getElementById('title').value || 'Title') + ' @ ' + (document.getElementById('company').value || 'Company');
            document.getElementById('prev-email').innerText = document.getElementById('email').value || 'hello@example.com';
        }

        function toggleAbility(btn, className) {
            const sig = document.getElementById('main-sig');
            const avatar = document.getElementById('avatar');
            const accent = document.getElementById('accent-bar');

            btn.classList.toggle('toggle-active');

            // Map button clicks to preview transformations
            if (className === 'avatar-round') {
                avatar.classList.toggle('rounded');
            } else if (className === 'hide-accent') {
                accent.classList.toggle('hidden');
            } else if (className === 'compact-social') {
                document.querySelectorAll('.social-icon').forEach(s => s.classList.toggle('w-6'));
                document.querySelectorAll('.social-icon').forEach(s => s.classList.toggle('h-6'));
            } else {
                sig.classList.toggle(className);
            }
        }
    </script>
</body>

</html>
